description "hyperboria dynamic DNS peer resolver startup script"

author "Adam Novak <interfect@gmail.com>"
# Based on cjsdns Upstart config by Sergey Davidoff <shnatsel@gmail.com>
# Requires that you be using Upstart to control hyperboria

start on started hyperboria
stop on stopping hyperboria

# respawn if it crashes, but no more than once in 180 seconds
respawn
respawn limit 2 300

pre-start script
    if ! [ -e /etc/hyperboria-dynamic.conf ]; then
        ( # start a subshell to avoid side effects of umask later on
            umask 077 # to create the file with 600 permissions without races

            # Make an empty config file; nodes to contact go here.
            touch /etc/hyperboria-dynamic.conf

            # By default we install a config, so this only happens if the user
            # deletes it
        ) # exit subshell; umask no longer applies
        echo 'WARNING: A new hyperboria-dynamic.conf file has been generated.'
    fi

    if ! [ -e /etc/hyperboria-dynamic.hyperboriaadmin ]; then
        ( # start a subshell to avoid side effects of umask later on
            umask 077 # to create the file with 600 permissions without races

            # Make a cjdnsadmin file from the hyperboria-route.conf. We're not using
            # /root/.hyperboriaadmin because that would be silly.

            # TODO: Make the hyperboria Upstart job put something in /var that other
            # root processes can read.
            /usr/lib/hyperboria/cjdnsadminmaker.py /etc/hyperboria-dynamic.hyperboriaadmin
        ) # exit subshell; umask no longer applies
        echo 'WARNING: A new hyperboria-dynamic.hyperboriaadmin file has been generated.'
    fi
end script

exec /usr/lib/hyperboria/dynamicEndpoints.py /etc/hyperboria-dynamic.conf --adminInfo /etc/hyperboria-dynamic.hyperboriaadmin
